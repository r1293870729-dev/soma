[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soma-protocol-audit"
version = "0.1.0"
description = "Auditable engineering reference; not a completed SOMA reproduction"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
audit = ["pandas", "scikit-learn", "scipy"]
legacy = ["torch", "torchvision", "h5py", "matplotlib", "pandas", "scikit-learn"]

[tool.setuptools.packages.find]
where = ["src"]
